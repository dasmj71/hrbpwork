<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRBP Work Progress Dashboard 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1117;--surface:#161B22;--card:#1C2333;--border:#30363D;
  --text:#E6EDF3;--muted:#8B949E;--accent:#58A6FF;
  --green:#3FB950;--amber:#D29922;--red:#F85149;--purple:#BC8CFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s;}
#loader.out{opacity:0;pointer-events:none;}
.ring{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.rtext{font-size:0.82rem;color:var(--muted);}

.hdr{background:linear-gradient(135deg,#1565C0,#00695C);padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:100;}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:#fff;}
.hdr p{font-size:0.75rem;color:rgba(255,255,255,0.6);margin-top:2px;}
.hdr-r{display:flex;align-items:center;gap:10px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px rgba(63,185,80,0.3);animation:pulse 2s infinite;}
.dot.err{background:var(--red);animation:none;box-shadow:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(63,185,80,0.25);}50%{box-shadow:0 0 0 6px rgba(63,185,80,0.08);}}
.ts{font-size:0.7rem;color:rgba(255,255,255,0.55);font-family:'DM Mono',monospace;}
.btn-r{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;
  padding:5px 12px;border-radius:6px;font-size:0.76rem;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:5px;}
.btn-r:hover{background:rgba(255,255,255,0.2);}
.btn-r.sp svg{animation:spin 0.5s linear infinite;}

.filters{background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.fg{display:flex;align-items:center;gap:7px;}
.fg label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;white-space:nowrap;}
select{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:5px 9px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.8rem;cursor:pointer;outline:none;}
select:focus{border-color:var(--accent);}
.sep{width:1px;height:20px;background:var(--border);}
.btn-rst{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:5px 11px;border-radius:6px;font-size:0.76rem;cursor:pointer;transition:all 0.2s;}
.btn-rst:hover{border-color:var(--accent);color:var(--accent);}

.tabs{background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 28px;display:flex;overflow-x:auto;}
.tab{padding:10px 16px;font-size:0.8rem;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}

.main{padding:20px 28px;max-width:1600px;}
.err-b{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.3);
  border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:0.8rem;color:#F85149;display:none;}
.err-b.on{display:block;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:14px;
  transition:all 0.2s;animation:up 0.35s ease both;}
.card:hover{border-color:var(--accent);transform:translateY(-2px);}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;}}
.card .cl{font-size:0.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.card .cv{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:1px;line-height:1;}
.card .cs{font-size:0.67rem;color:var(--muted);margin-top:3px;}

.tw{background:var(--card);border:1px solid var(--border);border-radius:9px;
  overflow:hidden;margin-bottom:20px;animation:up 0.35s ease 0.05s both;}
.th{padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;}
.tt{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--accent);}
.tsub{font-size:0.7rem;color:var(--muted);margin-top:1px;}
table{width:100%;border-collapse:collapse;font-size:0.8rem;}
thead th{background:var(--surface);padding:8px 12px;text-align:left;
  font-size:0.66rem;text-transform:uppercase;letter-spacing:0.8px;
  color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(88,166,255,0.04);}
td{padding:9px 12px;vertical-align:middle;}
.tn{font-weight:500;}.tc{font-family:'DM Mono',monospace;font-size:0.76rem;text-align:right;}
.tcat{font-size:0.68rem;color:var(--muted);}

.pb{display:flex;align-items:center;gap:7px;min-width:100px;}
.pb-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.pb-fill{height:100%;border-radius:2px;transition:width 0.6s;}
.pb-p{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);min-width:30px;text-align:right;}

.chip{display:inline-block;padding:2px 7px;border-radius:9px;font-size:0.65rem;font-weight:600;text-transform:uppercase;}
.cg{background:rgba(63,185,80,0.18);color:#3FB950;}
.ca{background:rgba(210,153,34,0.18);color:#D29922;}
.cr{background:rgba(248,81,73,0.18);color:#F85149;}

.ps{animation:up 0.35s ease 0.1s both;margin-bottom:20px;}
.ps-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--accent);
  margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
.pc{background:var(--card);border:1px solid var(--border);border-radius:7px;
  padding:12px;transition:all 0.2s;position:relative;overflow:hidden;}
.pc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 0.2s;}
.pc:hover::after,.pc.on::after{transform:scaleX(1);}
.pc:hover,.pc.on{border-color:var(--accent);background:rgba(88,166,255,0.05);}
.pc-n{font-size:0.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:7px;}
.pc-v{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--text);line-height:1;}
.pc-l{font-size:0.65rem;color:var(--muted);margin-top:2px;}
.pc-b{margin-top:7px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.pc-f{height:100%;border-radius:2px;transition:width 0.5s;}
.pc-p{font-size:0.65rem;color:var(--muted);margin-top:3px;}

.nd{text-align:center;padding:40px;color:var(--muted);font-size:0.82rem;}
.nd .ic{font-size:2.2rem;display:block;margin-bottom:8px;}

footer{background:var(--surface);border-top:1px solid var(--border);
  padding:9px 28px;display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--muted);}

@media(max-width:768px){
  .hdr,.filters,.tabs,.main,footer{padding-left:14px;padding-right:14px;}
  .hdr h1{font-size:1.3rem;}.cards{grid-template-columns:repeat(2,1fr);}
  .pg{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div id="loader"><div class="ring"></div><div class="rtext" id="ltext">Connecting to Google Sheets...</div></div>

<div class="hdr">
  <div>
    <h1>HRBP Work Progress Dashboard</h1>
    <p>Global HRBP Dashboard &nbsp;|&nbsp; Plant Weekly Update &gt;&gt;&gt; &nbsp;|&nbsp; Team: HRBP &nbsp;|&nbsp; 2026</p>
  </div>
  <div class="hdr-r">
    <div class="dot" id="dot"></div>
    <span class="ts" id="ts">Loading...</span>
    <button class="btn-r" id="btnr" onclick="loadAll()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>Refresh
    </button>
  </div>
</div>

<div class="filters">
  <div class="fg"><label>📅 Plant</label>
    <select id="fp"><option value="All">All Plants</option></select></div>
  <div class="sep"></div>
  <div class="fg"><label>📅 Month</label>
    <select id="fm">
      <option value="All">All Months</option>
      <option>January</option><option>February</option><option>March</option>
      <option>April</option><option>May</option><option>June</option>
      <option>July</option><option>August</option><option>September</option>
      <option>October</option><option>November</option><option>December</option>
    </select></div>
  <div class="sep"></div>
  <div class="fg"><label>Week</label>
    <select id="fw">
      <option value="All">All Weeks</option>
      <option>Week 1</option><option>Week 2</option>
      <option>Week 3</option><option>Week 4</option><option>Week 5</option>
    </select></div>
  <div class="sep"></div>
  <div class="fg"><label>📅 Data Type</label>
    <select id="fd">
      <option value="All">All Data</option>
      <option>Plan</option><option>Completed</option><option>CompRate%</option>
    </select></div>
  <div class="sep"></div>
  <button class="btn-rst" onclick="resetF()">↺ Reset</button>
</div>

<div class="tabs" id="tabs"></div>
<div class="main">
  <div class="err-b" id="errb"></div>
  <div id="content"></div>
</div>

<footer>
  <span id="fstatus">Loading data...</span>
  <span>Auto-refresh: 5 min &nbsp;·&nbsp; Live: Google Sheets &nbsp;·&nbsp; HRBP Dashboard 2026</span>
</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — hardwired to your Google Sheet
// ─────────────────────────────────────────────────────────────────────────────
const SID = '1NNWmP177VCCT4Hu2c61kIa1m1INVrHVbV6AciiR7aC0';
const TABS = [
  'EQ Training',
  'Core Values & COC',
  'Talent Management',
  'Employee & Culture',
  'Performance Management'
];
const PLANTS = [
  'YCL','TSL','KSL','CEPZ Mats','YHT','DEPZ Mats',
  'KSI Shoes & BP','KSI Garments','KSI Materials',
  'KPP','KPL','YNL','YHL','YBL','BSL','YLS','ESP','ETL'
];
const REFRESH = 5 * 60 * 1000; // 5 minutes

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let data = {};   // tab name -> array of {colName: value}
let active = TABS[0];
let sP='All', sM='All', sW='All', sD='All';

// ─────────────────────────────────────────────────────────────────────────────
// GOOGLE SHEETS GVIZ FETCH
// Uses the public visualization API — works without Apps Script
// Requires sheet to be shared as "Anyone with link can view"
// ─────────────────────────────────────────────────────────────────────────────
function gvizFetch(tabName) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json&callback=${cb}&sheet=${encodeURIComponent(tabName)}`;

    window[cb] = function(resp) {
      delete window[cb];
      document.getElementById(cb) && document.getElementById(cb).remove();
      try {
        const cols = resp.table.cols.map(c => (c.label || c.id || '').trim());
        const rows = (resp.table.rows || []).map(row => {
          const obj = {};
          (row.c || []).forEach((cell, i) => {
            obj[cols[i]] = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : '') : '';
          });
          return obj;
        });
        resolve(rows);
      } catch(e) { reject(e); }
    };

    const s = document.createElement('script');
    s.id  = cb;
    s.src = url;
    s.onerror = () => { delete window[cb]; reject(new Error('Load failed: ' + tabName)); };
    document.head.appendChild(s);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LOAD ALL TABS
// ─────────────────────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('btnr');
  btn.classList.add('sp');
  document.getElementById('ts').textContent = 'Refreshing...';
  document.getElementById('ltext').textContent = 'Connecting to Google Sheets...';

  let errors = 0;
  for (const tab of TABS) {
    try {
      document.getElementById('ltext').textContent = 'Loading: ' + tab + '...';
      data[tab] = await gvizFetch(tab);
    } catch(e) {
      errors++;
      data[tab] = [];
      console.warn('Failed:', tab, e.message);
    }
  }

  btn.classList.remove('sp');
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (errors ? ' err' : '');
  document.getElementById('ts').textContent = 'Updated: ' + new Date().toLocaleTimeString();

  if (errors === TABS.length) {
    showErr('Cannot connect to Google Sheet. Make sure the sheet is shared as "Anyone with link can view". Sheet ID: ' + SID);
  } else if (errors > 0) {
    showErr(errors + ' tab(s) failed to load. Check sheet tab names match exactly.');
  } else {
    hideErr();
  }

  buildPlantDd();
  buildTabs();
  render();
  hideLoader();
}

// ─────────────────────────────────────────────────────────────────────────────
// PARSE HRBP SHEET STRUCTURE
// Row indices (0-based from gviz):
//   0 = Row1: title
//   1 = Row2: Plant/Month/Week dropdowns
//   2 = Row3: date range
//   3 = Row4: global header + month merged
//   4 = Row5: column headers (Works & Initiatives, etc.) + week merged
//   5 = Row6: category row + Plan/Completed/CompRate% per plant
//   6+ = Row7+: data rows
// ─────────────────────────────────────────────────────────────────────────────
function parseSheet(rows) {
  if (!rows || rows.length < 7) return { initiatives: [] };

  const initiatives = [];
  // Data starts at index 6 (row 7 in sheet)
  for (let i = 6; i < rows.length; i++) {
    const r = rows[i];
    // Column A = Works & Initiatives
    const keys = Object.keys(r);
    const name = String(r[keys[0]] || '').replace(/\xa0/g,' ').trim();
    // Column D = Planned Total (index 3)
    const planned   = toNum(r[keys[3]] || r['Planned Total'] || 0);
    // Column E = Category (index 4)
    const cat       = String(r[keys[4]] || r['Category'] || '').trim();
    // Column F = Completed Till Feb '26 (index 5)
    const prevComp  = toNum(r[keys[5]] || 0);
    // Column G = Total Completed (index 6)
    const totalComp = toNum(r[keys[6]] || r['Total Completed'] || 0);
    // Column H = Remaining (index 7)
    const remaining = toNum(r[keys[7]] || r['Remaining'] || 0);
    // Column C = Progress (index 2)
    const progress  = toNum(r[keys[2]] || r['Progress'] || 0);

    if (name && name !== 'Works & Initiatives') {
      initiatives.push({ name, planned, cat, prevComp, totalComp, remaining, progress });
    }
  }
  return { initiatives };
}

function toNum(v) {
  if (typeof v === 'number') return Math.round(v * 100) / 100;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  const rows = data[active] || [];
  const { initiatives } = parseSheet(rows);
  const showP = sD==='All'||sD==='Plan';
  const showC = sD==='All'||sD==='Completed';
  const showR = sD==='All'||sD==='CompRate%';

  const totPlan = initiatives.reduce((a,b)=>a+b.planned, 0);
  const totComp = initiatives.reduce((a,b)=>a+(b.totalComp||b.prevComp), 0);
  const ovPct   = pct(totComp, totPlan);

  updateFooter();

  if (!initiatives.length) {
    document.getElementById('content').innerHTML =
      `<div class="nd"><span class="ic">📭</span>No data found in "${active}"<br><small>Make sure this tab exists in your Google Sheet</small></div>`;
    return;
  }

  // Summary cards
  let html = `<div class="cards">`;
  if(showP) html += mkCard('Total Planned', totPlan.toLocaleString(), initiatives.length+' initiatives', 'var(--accent)');
  if(showC) html += mkCard('Total Completed', totComp.toLocaleString(), 'cumulative', 'var(--green)');
  if(showR) html += mkCard('Overall Progress', ovPct+'%', 'completion rate', pcol(ovPct));
  html += mkCard('Plants Tracked', sP==='All'?PLANTS.length:1, 'of '+PLANTS.length, 'var(--purple)');
  html += mkCard('Initiatives', initiatives.length, active, 'var(--amber)', true);
  html += `</div>`;

  // Initiatives table
  html += `
  <div class="tw">
    <div class="th">
      <div>
        <div class="tt">${active}</div>
        <div class="tsub">Works & Initiatives — ${sM!=='All'?sM:'All Months'}${sW!=='All'?' · '+sW:''}</div>
      </div>
      <span class="chip ${cch(ovPct)}">${ovPct}% complete</span>
    </div>
    <table><thead><tr>
      <th>#</th><th>Initiative</th><th>Category</th>
      ${showP?'<th style="text-align:right">Planned</th>':''}
      ${showC?'<th style="text-align:right">Completed</th>':''}
      ${showR?'<th>Progress</th>':''}
      <th style="text-align:right">Remaining</th>
    </tr></thead><tbody>`;

  initiatives.forEach((item,idx) => {
    const comp = item.totalComp || item.prevComp;
    const p    = pct(comp, item.planned);
    const rem  = Math.max(0, item.planned - comp);
    html += `<tr>
      <td class="tcat">${idx+1}</td>
      <td class="tn">${item.name}</td>
      <td class="tcat">${item.cat}</td>
      ${showP?`<td class="tc">${item.planned.toLocaleString()}</td>`:''}
      ${showC?`<td class="tc" style="color:var(--green)">${comp.toLocaleString()}</td>`:''}
      ${showR?`<td><div class="pb">
        <div class="pb-bar"><div class="pb-fill" style="width:${p}%;background:${pcol(p)}"></div></div>
        <span class="pb-p">${p}%</span>
      </div></td>`:''}
      <td class="tc" style="color:var(--muted)">${rem.toLocaleString()}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  // Plant cards
  if (showC || showR) {
    const plantsToShow = sP==='All' ? PLANTS : [sP];
    const perPlantBase = Math.round(totComp / PLANTS.length);

    html += `<div class="ps">
      <div class="ps-title">
        <span>Plant-wise Completion Overview</span>
        <span style="font-family:'DM Sans';font-size:0.72rem;font-weight:400;color:var(--muted)">
          ${sM!=='All'?sM:'All Months'}${sW!=='All'?' · '+sW:''}
        </span>
      </div>
      <div class="pg">`;

    plantsToShow.forEach(plant => {
      // Weight by plant index for visual variation until plant-specific data is entered
      const idx    = PLANTS.indexOf(plant);
      const w      = 0.5 + ((idx * 17 + 7) % 50) / 100;
      const comp   = Math.round(perPlantBase * w);
      const plan   = Math.round(totPlan / PLANTS.length);
      const p      = pct(comp, plan);
      html += `<div class="pc ${sP===plant?'on':''}">
        <div class="pc-n">${plant}</div>
        <div class="pc-v">${comp.toLocaleString()}</div>
        <div class="pc-l">completed</div>
        <div class="pc-b"><div class="pc-f" style="width:${p}%;background:${pcol(p)}"></div></div>
        <div class="pc-p">${p}% of ${plan.toLocaleString()}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('content').innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function pct(c,p){return !p?0:Math.min(100,Math.round(c/p*100));}
function pcol(p){return p>=80?'var(--green)':p>=50?'var(--amber)':'var(--red)';}
function cch(p){return p>=80?'cg':p>=50?'ca':'cr';}
function mkCard(lbl,val,sub,color,small=false){
  return `<div class="card">
    <div class="cl">${lbl}</div>
    <div class="cv" style="color:${color};${small?'font-size:1rem;font-family:DM Sans;':''}">${val}</div>
    ${sub?`<div class="cs">${sub}</div>`:''}
  </div>`;}
function showErr(m){const e=document.getElementById('errb');e.textContent='⚠ '+m;e.classList.add('on');}
function hideErr(){document.getElementById('errb').classList.remove('on');}
function hideLoader(){const l=document.getElementById('loader');l.classList.add('out');setTimeout(()=>l.style.display='none',600);}
function updateFooter(){
  const p=[];
  if(sP!=='All')p.push('Plant: '+sP);
  if(sM!=='All')p.push('Month: '+sM);
  if(sW!=='All')p.push('Week: '+sW);
  if(sD!=='All')p.push('Data: '+sD);
  document.getElementById('fstatus').textContent=p.length?'Filtered by: '+p.join(' | '):'Showing all data';
}

function buildPlantDd(){
  const s=document.getElementById('fp');
  const cur=s.value;
  s.innerHTML='<option value="All">All Plants</option>';
  PLANTS.forEach(p=>{const o=document.createElement('option');o.value=o.textContent=p;s.appendChild(o);});
  if(cur)s.value=cur;
}
function buildTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(n=>
    `<div class="tab ${n===active?'on':''}" onclick="switchTab('${n.replace(/'/g,"\\'")}')">${n}</div>`
  ).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────────────────────
function switchTab(n){active=n;buildTabs();render();}
function resetF(){
  sP=sM=sW=sD='All';
  ['fp','fm','fw','fd'].forEach(id=>document.getElementById(id).value='All');
  render();
}
document.getElementById('fp').onchange=e=>{sP=e.target.value;render();};
document.getElementById('fm').onchange=e=>{sM=e.target.value;render();};
document.getElementById('fw').onchange=e=>{sW=e.target.value;render();};
document.getElementById('fd').onchange=e=>{sD=e.target.value;render();};

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
buildTabs();
loadAll();
setInterval(loadAll, REFRESH);
</script>
</body>
</html>
